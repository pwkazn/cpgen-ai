# Explicit preview workflow. Replace the private path, provider endpoints,
# model, service identity and cost ceilings for your deployment before use.
# API keys are read from the named environment variables only at dispatch.
storage:
  state_root: D:/cpgen-private/slice2
workflow:
  revision: slice2.idea.statement.similarity.checkpoint.v1
  idea_count: 2
  llm_cost_upper_bound_micro_usd: 100000
  similarity_cost_upper_bound_micro_usd: 100000
llm:
  base_url: https://provider.example.com/v1
  model: replace-with-supported-model
  api_key_env: CPGEN_LLM_API_KEY
  timeout: 30s
  max_output_tokens: 4096
  max_response_bytes: 1048576
  max_format_repairs: 0
similarity:
  endpoint: https://similarity.example.com/search
  api_key_env: CPGEN_SIMILARITY_API_KEY
  provider_identity: replace-with-provider-identity
  service_identity: replace-with-index-revision
  timeout: 30s
  max_response_bytes: 1048576
  limit: 20
  policy_ref: similarity-policy/v1
  acceptance_threshold: 0.5
  rejection_threshold: 0.8
  minimum_hits: 1
